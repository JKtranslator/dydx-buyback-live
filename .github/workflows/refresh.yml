name: Refresh data

# The "Refresh data" button on the dashboard links here. Run workflow -> pulls a fresh Binance
# order book + 24h volume, commits data/snapshot.json, and Pages redeploys automatically.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'      # hourly

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Pull snapshot from Binance
        run: python scripts/refresh.py

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/snapshot.json
          if git diff --staged --quiet; then
            echo "no change"
          else
            git commit -m "data: refresh DYDX snapshot"
            git push
          fi
